name: Repository checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run check:docs
      - run: npm run test:repo
      - run: npm run typecheck
      - run: npx turbo run test
      - run: npm run build
      - name: Validate laptop Compose configuration
        run: KAN_PUBLIC_URL=http://localhost:8787 docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.local.yml config --quiet
      - name: Validate production Compose configuration
        env:
          KAN_PUBLIC_URL: https://kan.example.test
          KAN_SERVICE_SECRET: ci-placeholder-service-secret
          BETTER_AUTH_SECRET: ci-placeholder-auth-secret-0123456789
        run: docker compose config --quiet
      - run: npx agent-browser install --with-deps
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: web-smoke
          path: /tmp/kan-smoke.png
          if-no-files-found: ignore
