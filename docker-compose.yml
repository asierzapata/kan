services:
  server:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      KAN_DATA_DIR: /data
      PORT: 8787
      KAN_ENV: ${KAN_ENV:-production}
      KAN_PUBLIC_URL: ${KAN_PUBLIC_URL:?set KAN_PUBLIC_URL}
      KAN_SERVICE_SECRET: ${KAN_SERVICE_SECRET:?set KAN_SERVICE_SECRET}
      DATABASE_URL: ${DATABASE_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      EVE_URL: ${EVE_URL:-}
      KAN_RUN_CEILING: ${KAN_RUN_CEILING:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - kan-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    init: true
    pull_policy: always
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:?set CF_TUNNEL_TOKEN in Dokploy}
    depends_on:
      server:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  kan-data:
