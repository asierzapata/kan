# Production-shaped stack: the Kan server (API, sync, SPA, scheduler) and the
# eve agent. Run with an env file (see .env.example):
#   docker compose --env-file .env.local up --build -d
# For a laptop with no Postgres or S3, add docker-compose.local.yml.
services:
  server:
    build:
      context: .
      args:
        VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY:-}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8787:8787"
    environment:
      KAN_DATA_DIR: /data
      PORT: 8787
      KAN_ENV: ${KAN_ENV:-production}
      KAN_PUBLIC_URL: ${KAN_PUBLIC_URL:?set KAN_PUBLIC_URL}
      KAN_SERVICE_SECRET: ${KAN_SERVICE_SECRET:?set KAN_SERVICE_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      DATABASE_URL: ${DATABASE_URL:-}
      EVE_URL: http://eve:3000
      KAN_RUN_CEILING: ${KAN_RUN_CEILING:-}
      KAN_CONTEXT_RUN_CAP: ${KAN_CONTEXT_RUN_CAP:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
    volumes:
      - kan-data:/data
    depends_on:
      eve:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  eve:
    build:
      context: .
      dockerfile: apps/web-agent/Dockerfile
      args:
        WORKFLOW_POSTGRES_URL: ${WORKFLOW_POSTGRES_URL:-}
    init: true
    restart: unless-stopped
    environment:
      PORT: 3000
      KAN_SERVICE_SECRET: ${KAN_SERVICE_SECRET:?set KAN_SERVICE_SECRET}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      WEB_API_URL: http://server:8787/api/web
      WORKFLOW_POSTGRES_URL: ${WORKFLOW_POSTGRES_URL:-}
    volumes:
      - eve-data:/app/apps/web-agent/.eve/.workflow-data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/eve/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  kan-data:
  eve-data:
